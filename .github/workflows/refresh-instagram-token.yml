name: Refresh Instagram Access Token

on:
  schedule:
    # Runs at 00:00 on the 1st of every month
    - cron: '0 0 1 * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get Instagram token from Vercel
        id: get-token
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # First, get the environment variable ID
          ENV_INFO=$(curl -s "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            | jq -r '.envs[] | select(.key=="INSTAGRAM_ACCESS_KEY")')
          
          ENV_ID=$(echo "$ENV_INFO" | jq -r '.id')
          if [ -z "$ENV_ID" ] || [ "$ENV_ID" = "null" ]; then
            echo "Error: Could not find INSTAGRAM_ACCESS_KEY in Vercel"
            exit 1
          fi
          
          # Then, get the decrypted value using the v1 API
          CURRENT_TOKEN=$(curl -s "https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/env/${ENV_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            | jq -r '.value')
          
          if [ -z "$CURRENT_TOKEN" ] || [ "$CURRENT_TOKEN" = "null" ]; then
            echo "Error: Could not retrieve decrypted INSTAGRAM_ACCESS_KEY from Vercel"
            exit 1
          fi
          
          echo "env_id=${ENV_ID}" >> $GITHUB_OUTPUT
          echo "current_token=${CURRENT_TOKEN}" >> $GITHUB_OUTPUT

      - name: Refresh Instagram token
        id: refresh-token
        run: |
          RESPONSE=$(curl -s -G "https://graph.instagram.com/refresh_access_token" \
            --data-urlencode "grant_type=ig_refresh_token" \
            --data-urlencode "access_token=${{ steps.get-token.outputs.current_token }}")
          NEW_TOKEN=$(echo $RESPONSE | jq -r '.access_token')
          if [ -z "$NEW_TOKEN" ] || [ "$NEW_TOKEN" = "null" ]; then
            echo "Error: Failed to refresh Instagram token. Response: ${RESPONSE}"
            exit 1
          fi
          echo "new_token=${NEW_TOKEN}" >> $GITHUB_OUTPUT
          echo "expires_in=$(echo $RESPONSE | jq -r '.expires_in')" >> $GITHUB_OUTPUT

      - name: Update token in Vercel
        if: steps.refresh-token.outputs.new_token != ''
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Prepare the current date
          CURRENT_DATE=$(date -u +"%Y-%m-%d")
          
          # Create the JSON payload
          JSON_PAYLOAD=$(jq -n \
            --arg key "INSTAGRAM_ACCESS_KEY" \
            --arg value "${{ steps.refresh-token.outputs.new_token }}" \
            --arg date "$CURRENT_DATE" \
            --arg expires "${{ steps.refresh-token.outputs.expires_in }}" \
            '{
              key: $key,
              value: $value,
              type: "encrypted",
              target: ["production", "preview", "development"],
              comment: "Updated by GitHub Actions on \($date). Expires in \($expires) seconds."
            }')
          
          # Make the API request and capture the response
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env/${{ steps.get-token.outputs.env_id }}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")
          
          # Extract the HTTP status code
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          # Extract the response body
          RESPONSE_BODY=$(echo "$RESPONSE" | sed '$ d')
          
          # Check if the request was successful
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error: Failed to update environment variable in Vercel"
            echo "Status code: $HTTP_STATUS"
            echo "Response: $RESPONSE_BODY"
            exit 1
          fi
          
          echo "Successfully updated Instagram token in Vercel"