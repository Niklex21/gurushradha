name: Refresh Instagram Access Token

on:
  schedule:
    # Run weekly so a missed run still leaves a large safety margin before
    # Meta's long-lived token expires.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instagram-token-refresh
  cancel-in-progress: false

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Refresh token and update Vercel
        env:
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ env.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${VERCEL_PROJECT_ID}" ] || [ -z "${VERCEL_TOKEN}" ]; then
            echo "VERCEL_PROJECT_ID and VERCEL_TOKEN GitHub secrets are required"
            exit 1
          fi

          ENV_INFO=$(curl --fail-with-body -sS "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json")

          ENV_ID=$(echo "${ENV_INFO}" | jq -r '.envs[] | select(.key == "INSTAGRAM_ACCESS_KEY") | .id' | head -n 1)
          ENV_TYPE=$(echo "${ENV_INFO}" | jq -r '.envs[] | select(.key == "INSTAGRAM_ACCESS_KEY") | .type' | head -n 1)

          if [ -z "${ENV_ID}" ] || [ "${ENV_ID}" = "null" ]; then
            echo "Error: Could not find INSTAGRAM_ACCESS_KEY in Vercel"
            exit 1
          fi

          if [ -z "${ENV_TYPE}" ] || [ "${ENV_TYPE}" = "null" ]; then
            ENV_TYPE="encrypted"
          fi

          # Vercel keeps encrypted values hidden in the list response. This
          # endpoint is the supported project-environment decryption endpoint.
          CURRENT_TOKEN=$(curl --fail-with-body -sS "https://api.vercel.com/v1/projects/${VERCEL_PROJECT_ID}/env/${ENV_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" | jq -r '.value // empty')

          if [ -z "${CURRENT_TOKEN}" ]; then
            echo "Error: Could not retrieve decrypted INSTAGRAM_ACCESS_KEY from Vercel"
            exit 1
          fi

          REFRESH_RESPONSE=$(curl --fail-with-body -sS -G "https://graph.instagram.com/refresh_access_token" \
            --data-urlencode "grant_type=ig_refresh_token" \
            --data-urlencode "access_token=${CURRENT_TOKEN}")
          NEW_TOKEN=$(echo "${REFRESH_RESPONSE}" | jq -r '.access_token // empty')
          EXPIRES_IN=$(echo "${REFRESH_RESPONSE}" | jq -r '.expires_in // empty')

          if [ -z "${NEW_TOKEN}" ] || [ -z "${EXPIRES_IN}" ]; then
            echo "Error: Instagram did not return a refreshed token"
            echo "Meta response: $(echo "${REFRESH_RESPONSE}" | jq -c 'del(.access_token)')"
            exit 1
          fi

          VALIDATION_RESPONSE=$(curl --fail-with-body -sS -G "https://graph.instagram.com/v21.0/me" \
            --data-urlencode "fields=id" \
            --data-urlencode "access_token=${NEW_TOKEN}")
          if ! echo "${VALIDATION_RESPONSE}" | jq -e '.id' >/dev/null; then
            echo "Error: Instagram returned a token that could not be validated"
            echo "Meta response: $(echo "${VALIDATION_RESPONSE}" | jq -c 'del(.id)')"
            exit 1
          fi

          CURRENT_DATE=$(date -u +"%Y-%m-%d")
          JSON_PAYLOAD=$(jq -n \
            --arg key "INSTAGRAM_ACCESS_KEY" \
            --arg value "${NEW_TOKEN}" \
            --arg type "${ENV_TYPE:-encrypted}" \
            --arg date "${CURRENT_DATE}" \
            --arg expires "${EXPIRES_IN}" \
            '{
              key: $key,
              value: $value,
              type: $type,
              target: ["production", "preview", "development"],
              comment: "Updated by GitHub Actions on \($date). Expires in \($expires) seconds."
            }')

          curl --fail-with-body -sS -X PATCH \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env/${ENV_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${JSON_PAYLOAD}" >/dev/null

          echo "Instagram token refreshed; Meta reports ${EXPIRES_IN} seconds until expiry."

      - name: Redeploy production with the new token
        env:
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ env.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          DEPLOYMENTS=$(curl --fail-with-body -sS \
            "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&limit=1" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json")
          DEPLOYMENT_ID=$(echo "${DEPLOYMENTS}" | jq -r '.deployments[0].uid // empty')

          if [ -z "${DEPLOYMENT_ID}" ]; then
            echo "Error: Could not find the latest production deployment"
            exit 1
          fi

          # Environment-variable changes only affect new deployments. The
          # Vercel CLI redeploys the existing production build with the new env.
          npx --yes vercel@latest redeploy "${DEPLOYMENT_ID}" \
            --token "${VERCEL_TOKEN}" \
            --target production

          echo "Production redeployment completed with the refreshed token."
